<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abrindo o WhatsApp · Eterno Dourado</title>
    <meta name="description" content="Estamos abrindo a conversa com o Leandro no WhatsApp." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050912" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bodoni-latin-normal-400-700.woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <!-- Página de contato: o cliente chega aqui ao pedir para falar, e daqui a conversa
         abre no WhatsApp. É esta URL que conta a conversão no Google Ads. -->
    <main class="obrigado" id="conteudo">
      <a class="marca" href="/" aria-label="Eterno Dourado, início">
        <span class="marca__eterno">Eterno</span>
        <span class="marca__dourado">Dourado</span>
      </a>

      <h1 class="obrigado__titulo">Abrindo a conversa</h1>
      <p class="obrigado__texto">
        Em um instante o WhatsApp abre com a sua mensagem pronta. Se não abrir sozinho,
        <a id="link-whatsapp" href="https://wa.me/5571991838595">toque aqui para falar com o Leandro</a>.
      </p>
      <a class="btn btn--contorno" href="/">Voltar ao catálogo</a>
    </main>

    <script type="module" src="/src/js/obrigado.js"></script>
  </body>
</html>
