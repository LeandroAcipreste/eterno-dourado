<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha carteira · Eterno Dourado</title>
    <meta name="description" content="A conta de cada pedido: o que fica com a fábrica e o que é comissão." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050912" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bodoni-latin-normal-400-700.woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/src/pages/admin/admin.css" />
    <link rel="stylesheet" href="/src/pages/carteira/carteira.css" />
  </head>

  <body data-page="carteira">
    <!-- A divisão do dinheiro, pedido a pedido: a fábrica fica com metade do valor de
         tabela mais o frete; o desconto dado e o frete incluso saem da comissão. -->
    <main class="admin" id="conteudo">
      <header class="admin__topo">
        <a class="marca" href="/" aria-label="Eterno Dourado, início">
          <span class="marca__eterno">Eterno</span>
          <span class="marca__dourado">Dourado</span>
        </a>
        <div class="admin__conta">
          <a class="btn btn--contorno btn--compacto" href="/src/pages/admin/admin.html">Voltar ao painel</a>
        </div>
      </header>

      <p class="admin__aviso" data-aviso role="status" hidden></p>

      <div data-painel hidden>
        <section class="admin__bloco">
          <h1 class="admin__titulo">Minha carteira</h1>

          <dl class="carteira__totais">
            <div class="carteira__total carteira__total--destaque">
              <dt>Minha comissão</dt>
              <dd data-total-comissao>—</dd>
            </div>
            <div class="carteira__total">
              <dt>Fábrica</dt>
              <dd data-total-fabrica>—</dd>
            </div>
            <div class="carteira__total">
              <dt>Faturado</dt>
              <dd data-total-faturado>—</dd>
            </div>
            <div class="carteira__total">
              <dt>Descontos dados</dt>
              <dd data-total-desconto>—</dd>
            </div>
            <div class="carteira__total">
              <dt>Fretes por minha conta</dt>
              <dd data-total-frete>—</dd>
            </div>
          </dl>
        </section>

        <section class="admin__bloco">
          <h2 class="admin__subtitulo">Pedido a pedido <span data-contagem></span></h2>
          <div class="admin__tabela">
            <table>
              <thead>
                <tr>
                  <th scope="col">Pedido</th>
                  <th scope="col">Cliente</th>
                  <th scope="col">Tabela R$</th>
                  <th scope="col">Desconto</th>
                  <th scope="col">Frete R$</th>
                  <th scope="col">Faturado R$</th>
                  <th scope="col">Fábrica R$</th>
                  <th scope="col">Comissão R$</th>
                </tr>
              </thead>
              <tbody data-pedidos></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/pages/carteira/carteira.js"></script>
  </body>
</html>
