<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha conta · Eterno Dourado</title>
    <meta name="description" content="O cadastro do lojista e os pedidos que ele já fez." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050912" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/bodoni-latin-normal-400-700.woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/src/pages/admin/admin.css" />
  </head>

  <body data-page="conta">
    <!-- A página do lojista fora do pedido: o cadastro dele, onde muda só nome, e-mail,
         CNPJ e senha (o resto é do Leandro), e os pedidos que já fez, com a folha de cada um. -->
    <nav class="menu" id="menu" aria-label="Principal" data-menu data-aberto="nao" inert>
      <ol class="menu__lista" role="list"></ol>
      <div class="menu__acoes"></div>
    </nav>

    <main class="admin" id="conteudo">
      <header class="admin__topo">
        <a class="marca" href="/" aria-label="Eterno Dourado, início">
          <span class="marca__eterno">Eterno</span>
          <span class="marca__dourado">Dourado</span>
        </a>
        <div class="admin__conta">
          <span data-quem></span>
          <button class="cabecalho__botao" type="button" aria-expanded="false" aria-controls="menu" data-menu-abrir hidden>
            <span class="sr">Abrir menu</span>
            <span aria-hidden="true">Menu</span>
            <span class="cabecalho__hamburguer" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <p class="admin__aviso" data-aviso role="status" hidden></p>

      <div class="admin__conteudo" data-painel hidden>
        <section class="admin__bloco" id="cadastro">
          <h1 class="admin__titulo">Meu cadastro</h1>

          <dl class="admin__ficha" data-condicoes></dl>

          <form class="admin__forma" data-forma-cadastro novalidate>
            <div class="campo">
              <label for="conta-nome">Nome</label>
              <input id="conta-nome" name="nome" type="text" autocomplete="organization" required />
            </div>
            <div class="campo">
              <label for="conta-email">E-mail</label>
              <input id="conta-email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="campo">
              <label for="conta-cnpj">CNPJ</label>
              <input id="conta-cnpj" name="cnpj" type="text" inputmode="numeric" />
            </div>
            <div class="campo">
              <label for="conta-senha">Nova senha</label>
              <input id="conta-senha" name="senha" type="password" autocomplete="new-password" minlength="8" placeholder="Em branco, continua a mesma" />
            </div>
            <button class="btn btn--ouro" type="submit">Salvar cadastro</button>
          </form>
        </section>

        <section class="admin__bloco" id="pedidos">
          <h2 class="admin__subtitulo">Meus pedidos <span data-contagem></span></h2>
          <div class="admin__tabela" data-tabela-pedidos hidden>
            <table>
              <thead>
                <tr>
                  <th scope="col">Pedido</th>
                  <th scope="col">Data</th>
                  <th scope="col">Alianças</th>
                  <th scope="col">Total R$</th>
                  <th scope="col">Situação</th>
                  <th scope="col">Folha</th>
                </tr>
              </thead>
              <tbody data-pedidos></tbody>
            </table>
          </div>
          <p class="admin__texto" data-sem-pedidos hidden>Nenhum pedido ainda.</p>
          <a class="btn btn--ouro btn--compacto" href="/src/pages/pedido/pedido.html">Fazer pedido</a>
        </section>
      </div>
    </main>

    <script type="module" src="/src/pages/conta/conta.js"></script>
  </body>
</html>
