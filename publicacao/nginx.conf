# O site no VPS, servido pelo nginx atrás do Traefik.
#
# Faz o que a Vercel fazia (URL sem extensão, cache longo em assets) e mais uma coisa
# que ela não podia fazer: /api responde no mesmo endereço do site, porque é o próprio
# nginx que repassa para o ERP. Sem outro domínio, sem CORS.
#
# Os cabeçalhos de segurança se repetem em cada location de propósito: o nginx não
# soma add_header, ele substitui. Um location com add_header próprio apaga os do
# servidor — foi assim que eles sumiram da primeira vez.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # o ERP ao lado, na rede do docker: para o navegador é o mesmo site
  location /api/ {
    proxy_pass http://erp:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  # a tabela de preço não é do site: ela alimenta o gerador e o ERP, e o navegador
  # nunca a pede. Publicada, qualquer um baixa o atacado inteiro.
  location ~ ^/src/data/precos.*\.json$ {
    return 404;
  }

  # os endereços curtos do menu e do rodapé
  location = /obrigado { try_files /src/pages/obrigado/obrigado.html =404; }
  location = /privacidade { try_files /src/pages/privacidade/privacidade.html =404; }
  location = /admin { try_files /src/pages/admin/admin.html =404; }
  location = /tabela { try_files /src/pages/tabela/tabela.html =404; }
  location = /carteira { try_files /src/pages/carteira/carteira.html =404; }
  location = /pedido { try_files /src/pages/pedido/pedido.html =404; }

  location = /whatsapp { return 302 /obrigado; }
  location = /zap { return 302 /obrigado; }

  # imagem, fonte e biblioteca não mudam de conteúdo sem mudar de nome
  location ~ ^/(assets|vendor)/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # o 3D precisa do tipo certo para o navegador aceitar
  location ~ \.glb$ {
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # o código e o HTML mudam no mesmo endereço: o navegador confere sempre
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri.html $uri/ =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
  gzip_min_length 1024;
}
